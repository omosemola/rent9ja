name: rentnaija
description: RentNaija - Premium Nigerian Real Estate Rental Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.0
  retrofit: ^4.0.3

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^2.3.2

  # Navigation
  go_router: ^17.3.0

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  smooth_page_indicator: ^2.0.1
  flutter_rating_bar: ^4.0.1
  photo_view: ^0.15.0
  carousel_slider: ^5.1.2

  # Maps
  google_maps_flutter: ^2.5.3
  geolocator: ^14.0.3
  geocoding: ^4.0.0

  # Forms & Validation
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0

  # Date/Time
  intl: any

  # Image Handling
  image_picker: ^1.0.5
  image_cropper: ^12.2.1

  # Chat
  socket_io_client: ^3.1.6

  # Push Notifications
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3

  # URL Launcher
  url_launcher: ^6.2.2

  # Share
  share_plus: ^13.3.0

  # Animations
  animations: ^2.0.11
  flutter_animate: ^4.3.0
  lottie: ^3.0.0

  # Utils
  permission_handler: ^12.0.3
  connectivity_plus: ^7.3.1
  logger: ^2.0.2+1
  timeago: ^3.6.1

  # Icons
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.6

  # Google Fonts
  google_fonts: ^8.2.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.7
  injectable_generator: ^2.4.1
  retrofit_generator: ^8.0.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/


