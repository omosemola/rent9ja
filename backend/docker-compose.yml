version: '3.8'

services:
  # PostgreSQL with PostGIS for geospatial queries
  postgres:
    image: postgis/postgis:16-3.4
    container_name: rentnaija-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rentnaija
      POSTGRES_USER: rentnaija
      POSTGRES_PASSWORD: rentnaija_secret
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rentnaija']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching, sessions, and rate limiting
  redis:
    image: redis:7-alpine
    container_name: rentnaija-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Application (for production)
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: rentnaija-api
  #   restart: unless-stopped
  #   ports:
  #     - '3000:3000'
  #   environment:
  #     DATABASE_URL: postgresql://rentnaija:rentnaija_secret@postgres:5432/rentnaija?schema=public
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
